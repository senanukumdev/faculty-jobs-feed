name: Daily Job Collector
on:
  schedule:
    - cron: "30 0 * * *" # 00:30 UTC = 6:00 AM IST daily
  workflow_dispatch:     # Adds a manual "Run workflow" button

permissions:
  contents: write        # Allows GitHub to save the updated jobs.json

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - run: python collect_jobs.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add jobs.json
          git commit -m "Update jobs.json" || exit 0
          git push
